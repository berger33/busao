name: cache
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: baixa Godot 4.7-stable
        run: |
          curl -sfL --retry 3 -o Godot_v4.7-stable_linux.x86_64.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          ls -lh Godot_v4.7-stable_linux.x86_64.zip
      - name: commita o zip
        run: |
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add Godot_v4.7-stable_linux.x86_64.zip
          if git diff --cached --quiet; then echo "nada novo"; else
            git commit -m "cache: Godot_v4.7-stable_linux.x86_64.zip (sandbox Arena)"
            git push origin HEAD:sandbox/godot-cache
          fi
