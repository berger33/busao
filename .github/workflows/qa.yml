# CI — Corre pro Ponto: portões Python + QA headless Godot a cada push/PR.
name: qa

on:
  push:
  pull_request:

jobs:
  gates:
    name: portões (validate + qa_full + manifests + VRAM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pre-flight
        run: python3 tools/validate_project.py
      - name: qa_full
        run: python3 tools/qa_full.py
      - name: provenance sync
        run: python3 tools/rebaseline_provenance.py --check
      - name: vram imports sync
        run: python3 tools/fix_texture_imports.py --check

  gdscript:
    name: gdscript (parse + estática)
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: instala gdtoolkit
        run: pip install gdtoolkit
      - name: selftest do analisador
        run: python3 tools/check_gdscript.py --selftest
      - name: scan (fixture intencional excluída)
        run: python3 tools/check_gdscript.py . --exclude 'lote2/tests/fixtures/*' | tee gdscan.txt
      - name: falha só em parse error real
        # Sem doc/classes do Godot o scan emite UNDECLARED de ruído (engine);
        # o portão aqui é: nenhum erro de parse e nenhum achado novo de lógica
        # (DUPLICATE, TOO_MANY/FEW_ARGS, MISSING_RETURN, ASSIGN_CONST).
        run: |
          ! grep -E "DUPLICATE|TOO_MANY_ARGS|TOO_FEW_ARGS|MISSING_RETURN|ASSIGN_CONST|UnexpectedToken|ParseError" gdscan.txt

  godot:
    name: godot headless (import + suítes)
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - name: baixa Godot (fallback de versão)
        run: |
          for v in 4.7 4.3 4.2; do
            url="https://github.com/godotengine/godot/releases/download/${v}-stable/Godot_v${v}-stable_linux.x86_64.zip"
            echo "tentando $url"
            if curl -sfL -o /tmp/godot.zip "$url"; then
              echo "GODOT_VERSION=$v" >> "$GITHUB_ENV"
              break
            fi
          done
          test -f /tmp/godot.zip || { echo "nenhum binário Godot disponível"; exit 1; }
          unzip -o /tmp/godot.zip -d /tmp && mv /tmp/Godot_v*-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot && /tmp/godot --version
      - name: import headless
        run: /tmp/godot --headless --path . --import
      - name: 16 suítes de etapa
        # Roda todas as suítes (não só até a primeira falha), guarda o log de cada
        # uma e publica o resumo: o log do Actions não é legível fora do navegador,
        # então o resumo vira comentário do PR e os logs viram artefato.
        run: |
          set -uo pipefail
          mkdir -p /tmp/suite-logs
          resumo=/tmp/suite-logs/resumo.txt
          : > "$resumo"
          falhas=0
          for s in tools/qa_etapa*.gd; do
            nome=$(basename "$s")
            echo "== $s"
            if /tmp/godot --headless --path . --script "$s" > "/tmp/suite-logs/$nome.log" 2>&1; then
              echo "PASS $nome" | tee -a "$resumo"
            else
              code=$?
              falhas=$((falhas + 1))
              echo "FAIL $nome (exit $code)" | tee -a "$resumo"
              echo "---- últimas 25 linhas de $nome ----"
              tail -25 "/tmp/suite-logs/$nome.log"
            fi
          done
          echo
          echo "==== RESUMO ===="
          cat "$resumo"
          echo "suítes com falha: $falhas"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            {
              echo "### QA headless — suítes de etapa (Godot ${GODOT_VERSION:-?})"
              echo
              echo '```'
              cat "$resumo"
              echo '```'
              echo
              echo "Suíte(s) com falha: **$falhas**. Logs completos no artefato `qa-suite-logs` desta execução."
            } > /tmp/suite-logs/comentario.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/suite-logs/comentario.md || echo "não foi possível comentar no PR"
          fi
          exit $((falhas > 0))
        env:
          GH_TOKEN: ${{ github.token }}
      - name: publica logs das suítes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-suite-logs
          path: /tmp/suite-logs
          if-no-files-found: ignore
